version: 2

sources:
  - name: bronze
    database: CT_VAISHNAVI_GUPTA_DB
    schema: EXTERNAL
    config:
      loaded_at_field: FILE_LAST_MODIFIED
      freshness:
        warn_after: {count: 1, period: day}
        error_after: {count: 200, period: day}
    tables:
      - name: campaigns_data
        identifier: EXT_CAMPAIGN_DATA
      - name: customers_data
        identifier: EXT_CUSTOMER_DATA
      - name: employees_data
        identifier: EXT_EMPLOYEE_DATA
      - name: orders_data
        identifier: EXT_ORDERS_DATA
      - name: products_data
        identifier: EXT_PRODUCT_DATA
        config:
          freshness:
            warn_after: {count: 12, period: day}
            error_after: {count: 200, period: day}
      - name: stores_data
        identifier: EXT_STORE_DATA
      - name: suppliers_data
        identifier: EXT_SUPPLIER_DATA